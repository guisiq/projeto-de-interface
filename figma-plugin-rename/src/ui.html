<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; font-size: 13px; padding: 16px; background: #f5f5f5; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #1e3a5f; }
    p { color: #555; margin-bottom: 12px; line-height: 1.5; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: #1e3a5f; color: white; }
    .btn-primary:hover { background: #2a4d7a; }
    .btn-secondary { background: white; color: #1e3a5f; border: 1px solid #1e3a5f; }
    .btn-secondary:hover { background: #eef3f9; }
    #status { margin-top: 12px; padding: 10px; border-radius: 6px; background: white; display: none; max-height: 300px; overflow-y: auto; }
    .detail { padding: 4px 0; border-bottom: 1px solid #eee; font-size: 12px; }
    .detail .old { color: #999; text-decoration: line-through; }
    .detail .new { color: #1e3a5f; font-weight: 600; }
    .warn { color: #b91c1c; }
    .success { color: #15803d; }
  </style>
</head>
<body>
  <h2>🏷️ Auto Rename Frames</h2>
  <p>Identifica cada frame pelo conteúdo de texto e aplica o nome correto (ex: "02 — Login", "10 — Cadastrar Perdido").</p>
  
  <button class="btn btn-primary" id="btn-rename" onclick="doRename()">Renomear Frames</button>
  <button class="btn btn-secondary" onclick="doList()">Listar Frames Atuais</button>

  <div id="status"></div>

  <script>
    function doRename() {
      document.getElementById('btn-rename').disabled = true;
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').innerHTML = '<p>Processando...</p>';
      parent.postMessage({ pluginMessage: { type: 'rename' } }, '*');
    }

    function doList() {
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').innerHTML = '<p>Carregando...</p>';
      parent.postMessage({ pluginMessage: { type: 'list-frames' } }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      const el = document.getElementById('status');
      el.style.display = 'block';

      if (msg.type === 'result') {
        const r = msg.result;
        let html = `<p class="success"><strong>✅ ${r.renamed} frames renomeados</strong></p>`;
        if (r.details.length > 0) {
          html += '<h3 style="margin:8px 0 4px">Renomeados:</h3>';
          for (const d of r.details) {
            html += `<div class="detail"><span class="old">${d.oldName}</span> → <span class="new">${d.newName}</span></div>`;
          }
        }
        if (r.unidentifiedFrames.length > 0) {
          html += `<h3 style="margin:8px 0 4px" class="warn">❓ Não identificados (${r.unidentified}):</h3>`;
          for (const u of r.unidentifiedFrames) {
            html += `<div class="detail"><strong>${u.name}</strong><br><small>${u.sampleText.substring(0, 80)}...</small></div>`;
          }
        }
        el.innerHTML = html;
        document.getElementById('btn-rename').disabled = false;
      }

      if (msg.type === 'frames-list') {
        let html = `<h3 style="margin-bottom:8px">${msg.frames.length} frames:</h3>`;
        for (const f of msg.frames) {
          html += `<div class="detail"><strong>${f.name}</strong> <small style="color:#888">(${f.id})</small><br><small>${f.text.substring(0, 60)}...</small></div>`;
        }
        el.innerHTML = html;
      }
    };
  </script>
</body>
</html>
